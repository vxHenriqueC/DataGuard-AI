<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataGuard AI</title>

    <link rel="stylesheet" href="style.css">
</head>
    
<body>

    <!-- ============================= -->
    <!-- SIDEBAR -->
    <!-- ============================= -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🛡
            </div>
            
            <div>
                <h1>DataGuard</h1>
                <span>AI Security</span>
            </div>

        </div>


        <nav>

            <a href="#" data-page="dashboard" class="active">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="#" data-page="analysis">
                <span>⌕</span>
                Analisar Dados
            </a>

            <a href="#" data-page="results">
                <span>◈</span>
                Resultados
            </a>

            <a href="#" data-page="reports">
                <span>▤</span>
                Relatórios
            </a>

            <a href="#" data-page="monitoring">
                <span>◉</span>
                Monitoramento
            </a>

            <a href="#" data-page="settings">
                <span>⚙</span>
                Configurações
            </a>

        </nav>


        <div class="sidebar-footer">

            <div class="status-dot"></div>

            <span>
                Sistema operacional
            </span>

        </div>

    </aside>


    <!-- ============================= -->
    <!-- MAIN -->
    <!-- ============================= -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <div>

                <p class="welcome">
                    Plataforma de segurança
                </p>

                <h2 id="page-title">
                    Dashboard
                </h2>

            </div>


            <div class="header-actions">

                <button
                    class="notification"
                    id="notificationBtn">
                    🔔
                </button>


                <div class="profile">

                    <div class="avatar">
                        U
                    </div>

                    <div>

                        <strong>
                            Usuário
                        </strong>

                        <span>
                            Administrador
                        </span>

                    </div>

                </div>

            </div>

        </header>


        <!-- CONTEÚDO -->

        <div id="app"></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
